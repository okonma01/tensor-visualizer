  <line x1="64" y1="110" x2="64" y2="72" stroke="#5a8a3c" stroke-width="4" stroke-linecap="round"/>
  <!-- Main leaf shape -->
  <path d="M64 20 Q95 35 90 65 Q85 90 64 95 Q43 90 38 65 Q33 35 64 20 Z" fill="#4caf50"/>
  <!-- Leaf veins -->
  <line x1="64" y1="25" x2="64" y2="90" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>
  <!-- Left veins -->
  <line x1="64" y1="40" x2="44" y2="50" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="52" x2="41" y2="60" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="64" x2="42" y2="70" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="75" x2="46" y2="80" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <!-- Right veins -->
  <line x1="64" y1="40" x2="84" y2="50" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="52" x2="87" y2="60" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="64" x2="86" y2="70" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="75" x2="82" y2="80" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <!-- Leaf shine -->
  <path d="M64 25 Q75 32 76 48 Q70 40 64 38 Q62 34 64 25 Z" fill="#81c784" opacity="0.5"/>
  <!-- Ground / soil dot -->
  <ellipse cx="64" cy="114" rx="14" ry="5" fill="#8d6e63" opacity="0.6"/>
</svg>
