  <rect x="52" y="78" width="24" height="20" rx="4" fill="#f4c2a1"/>
  <!-- Shoulders -->
  <rect x="30" y="90" width="68" height="34" rx="12" fill="#5b8dd9"/>
  <!-- Head -->
  <ellipse cx="64" cy="54" rx="28" ry="32" fill="#f4c2a1"/>
