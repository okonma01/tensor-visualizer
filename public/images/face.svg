  <!-- Mouth -->
  <path d="M55 67 Q64 73 73 67" fill="none" stroke="#c07050" stroke-width="2" stroke-linecap="round"/>
  <!-- Hair -->
  <path d="M36 50 Q34 28 50 22 Q64 18 78 22 Q94 28 92 50 Q88 36 64 34 Q40 36 36 50 Z" fill="#3a2010"/>
  <!-- Ears -->
