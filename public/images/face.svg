  <circle cx="56.5" cy="49.5" r="1" fill="white"/>
  <circle cx="76.5" cy="49.5" r="1" fill="white"/>
  <!-- Eyebrows -->
  <path d="M48 44 Q54 41 60 44" fill="none" stroke="#5a3e28" stroke-width="2" stroke-linecap="round"/>
